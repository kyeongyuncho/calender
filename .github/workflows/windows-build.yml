name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test folder opening and compatibility
        run: npm test
      - name: Test Electron window and saved data
        run: npm run smoke
      - name: Build installer and portable EXE
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: MyWorkCalendar-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
